<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressRing — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview" style="gap:40px">
  <div class="ds-ring" style="--ds-ring-pct:.72"><svg viewBox="0 0 120 120"><circle class="ds-ring-track" cx="60" cy="60" r="46"/><circle class="ds-ring-fill" cx="60" cy="60" r="46"/></svg><div class="ds-ring-center"><div class="ds-ring-value">72%</div><div class="ds-ring-label">Coverage</div></div></div>
  <div class="ds-ring" style="--ds-ring-pct:.38"><svg viewBox="0 0 120 120"><circle class="ds-ring-track" cx="60" cy="60" r="46"/><circle class="ds-ring-fill ds-ring-fill-violet" cx="60" cy="60" r="46"/></svg><div class="ds-ring-center"><div class="ds-ring-value">38%</div><div class="ds-ring-label">Quota</div></div></div>
  <div class="ds-ring ds-ring-sm" style="--ds-ring-pct:.9"><svg viewBox="0 0 120 120"><circle class="ds-ring-track" cx="60" cy="60" r="46"/><circle class="ds-ring-fill ds-ring-fill-success" cx="60" cy="60" r="46"/></svg><div class="ds-ring-center"><div class="ds-ring-value">90</div></div></div>
</div>
</body>
</html>
