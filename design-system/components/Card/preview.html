<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Card — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview-grid" style="grid-template-columns:repeat(3,1fr)">
  <div class="ds-card">
    <div class="ds-card-header"><h3 class="ds-card-title">Recent snippets</h3><button class="ds-icon-btn ds-icon-btn-sm" aria-label="More"><svg class="ds-icon ds-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div>
    <div class="ds-muted">12 saved this week · 3 shared</div>
    <div style="margin-top:16px"><div class="ds-progress"><div class="ds-progress-fill" style="width:62%"></div></div></div>
  </div>
  <div class="ds-card ds-card-cream">
    <div class="ds-stat-label" style="color:inherit;opacity:.7">Featured</div>
    <div style="font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.01em;margin-top:4px">JSON → TypeScript</div>
    <div class="ds-muted" style="margin-top:4px">Paste a payload, get typed interfaces.</div>
    <button class="ds-btn ds-btn-inverse ds-btn-sm" style="margin-top:16px">Open tool</button>
  </div>
  <div class="ds-card ds-card-hero">
    <div class="ds-stat-label" style="color:inherit;opacity:.75">Requests today</div>
    <div class="ds-stat-value" style="color:inherit">8,204</div>
    <div class="ds-muted">▲ 12% vs yesterday</div>
  </div>
</div>
</body>
</html>
