<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview">
  <button class="ds-btn ds-btn-primary"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Create project</button>
  <button class="ds-btn">Cancel</button>
  <button class="ds-btn ds-btn-inverse">View all</button>
  <button class="ds-btn ds-btn-ghost"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy JSON</button>
  <button class="ds-btn ds-btn-danger">Delete</button>
  <button class="ds-btn ds-btn-primary" disabled>Saving…</button>
</div>
<div class="ds-preview" style="padding-top:0">
  <button class="ds-btn ds-btn-sm ds-btn-primary">Run</button>
  <button class="ds-btn ds-btn-sm">Small</button>
  <button class="ds-btn ds-btn-lg ds-btn-primary">Sign in with Google</button>
</div>
</body>
</html>
