<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ProgressBar — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview ds-preview-col" style="max-width:420px">
  <div><div class="ds-progress-meta"><span>Storage</span><strong>6.2 GB / 10 GB</strong></div><div class="ds-progress" role="progressbar" aria-valuenow="62"><div class="ds-progress-fill" style="width:62%"></div></div></div>
  <div><div class="ds-progress-meta"><span>Monthly runs</span><strong>91%</strong></div><div class="ds-progress" role="progressbar" aria-valuenow="91"><div class="ds-progress-fill ds-progress-fill-warning" style="width:91%"></div></div></div>
  <div><div class="ds-progress-meta"><span>Used · Reserved</span><strong>40% · 25%</strong></div><div class="ds-progress"><div class="ds-progress-fill" style="width:40%;border-radius:9999px 0 0 9999px"></div><div class="ds-progress-fill ds-progress-fill-violet" style="width:25%;border-radius:0 9999px 9999px 0"></div></div></div>
</div>
</body>
</html>
