<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Input — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview" style="align-items:flex-start">
  <label class="ds-field"><span class="ds-label">Project name</span><input class="ds-input" placeholder="e.g. Regex tester"><span class="ds-help">Shown in the sidebar and on the board.</span></label>
  <label class="ds-field"><span class="ds-label">Search</span><span class="ds-input-wrap"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="ds-input" placeholder="Search tools…"><kbd class="ds-kbd">⌘K</kbd></span></label>
  <label class="ds-field"><span class="ds-label">Regex</span><input class="ds-input ds-mono" value="(\d+)-(?<year" aria-invalid="true"><span class="ds-help ds-help-error">Unclosed group at position 10.</span></label>
  <label class="ds-field"><span class="ds-label">Notes</span><textarea class="ds-input ds-textarea" placeholder="Optional"></textarea></label>
</div>
</body>
</html>
