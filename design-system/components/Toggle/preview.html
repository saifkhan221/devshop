<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toggle — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview" style="gap:24px">
  <label class="ds-toggle"><input type="checkbox" checked><span class="ds-toggle-track"></span>Auto-format on paste</label>
  <label class="ds-toggle"><input type="checkbox"><span class="ds-toggle-track"></span>Dark theme</label>
  <label class="ds-toggle ds-disabled"><input type="checkbox" checked disabled><span class="ds-toggle-track"></span>Locked</label>
</div>
</body>
</html>
