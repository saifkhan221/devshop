<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast — preview</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></head>
<body>
<div class="ds-preview ds-preview-col" style="align-items:flex-start">
  <div class="ds-toast ds-toast-success"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-9"/></svg><div><div class="ds-toast-title">Snippet saved</div><div class="ds-toast-body">Added to “Utilities”.</div></div><button class="ds-icon-btn ds-icon-btn-sm" aria-label="Dismiss"><svg class="ds-icon ds-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="ds-toast ds-toast-danger"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17h.01"/></svg><div><div class="ds-toast-title">Couldn't reach Firestore</div><div class="ds-toast-body">Your changes are kept locally and will retry.</div></div><button class="ds-icon-btn ds-icon-btn-sm" aria-label="Dismiss"><svg class="ds-icon ds-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
</div>
</body>
</html>
